<!DOCTYPE html>
<html lang="it" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetriClean Pro - Gestione Pulizia Vetrate</title>
    
    <!-- iOS Web App Standalone Mode & Theme Colors -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VetriClean">
    <meta name="theme-color" content="#075985">

    <!-- Favicon & Touch Icon Data URI -->
    <link rel="icon" id="dynamicFavicon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><defs><linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%230f172a'/><stop offset='50%' stop-color='%23075985'/><stop offset='100%' stop-color='%230284c7'/></linearGradient><linearGradient id='sparkle' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%2338bdf8'/><stop offset='100%' stop-color='%23ffffff'/></linearGradient></defs><rect width='512' height='512' rx='120' fill='url(%23bg)'/><path d='M120 370 L370 120' stroke='rgba(255,255,255,0.12)' stroke-width='28' stroke-linecap='round'/><path d='M150 190 L362 190' stroke='%23ffffff' stroke-width='32' stroke-linecap='round'/><path d='M180 190 L240 320 C248 338 264 338 272 320 L332 190' fill='none' stroke='url(%23sparkle)' stroke-width='24' stroke-linecap='round' stroke-linejoin='round'/><path d='M375 125 L383 143 L401 151 L383 159 L375 177 L367 159 L349 151 L367 143 Z' fill='%2338bdf8'/><path d='M145 345 L149 355 L159 359 L149 363 L145 373 L141 363 L131 359 L141 355 Z' fill='%23ffffff' opacity='0.9'/></svg>">
    
    <link rel="apple-touch-icon" id="appleTouchIcon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><defs><linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%230f172a'/><stop offset='50%' stop-color='%23075985'/><stop offset='100%' stop-color='%230284c7'/></linearGradient><linearGradient id='sparkle' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%2338bdf8'/><stop offset='100%' stop-color='%23ffffff'/></linearGradient></defs><rect width='512' height='512' rx='120' fill='url(%23bg)'/><path d='M120 370 L370 120' stroke='rgba(255,255,255,0.12)' stroke-width='28' stroke-linecap='round'/><path d='M150 190 L362 190' stroke='%23ffffff' stroke-width='32' stroke-linecap='round'/><path d='M180 190 L240 320 C248 338 264 338 272 320 L332 190' fill='none' stroke='url(%23sparkle)' stroke-width='24' stroke-linecap='round' stroke-linejoin='round'/><path d='M375 125 L383 143 L401 151 L383 159 L375 177 L367 159 L349 151 L367 143 Z' fill='%2338bdf8'/><path d='M145 345 L149 355 L159 359 L149 363 L145 373 L141 363 L131 359 L141 355 Z' fill='%23ffffff' opacity='0.9'/></svg>">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased bg-slate-100">

    <!-- TOP NAVIGATION HEADER -->
    <header class="bg-gradient-to-r from-sky-800 via-sky-900 to-indigo-950 text-white sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Brand Title -->
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-white/10 backdrop-blur border border-white/20 flex items-center justify-center text-sky-300 font-bold text-xl shadow-inner">
                        <i class="fa-solid fa-spray-can-sparkles"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight tracking-wide">VetriClean <span class="text-sky-300 font-normal">Pro</span></h1>
                        <p class="text-[11px] text-sky-200">Gestionale Pulizia Vetrate</p>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center space-x-2">
                    <button id="cloudStatusBadge" onclick="openCloudModal()" class="flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs font-medium bg-white/10 hover:bg-white/20 border border-white/20 text-sky-100 shadow-inner transition cursor-pointer" title="Configura Sincronizzazione Cloud">
                        <span id="cloudDot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
                        <span id="cloudStatusText" class="hidden sm:inline">Connessione Cloud...</span>
                    </button>

                    <button onclick="openQuickDailyModal()" class="bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-medium text-xs sm:text-sm px-3.5 py-2 rounded-xl shadow-lg transition flex items-center gap-2" title="Registrazione Rapida Interventi e Incassi">
                        <i class="fa-solid fa-bolt"></i>
                        <span class="hidden sm:inline">Registra Giornata</span>
                    </button>

                    <button onclick="openAddModal()" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-medium text-xs sm:text-sm px-3.5 py-2 rounded-xl shadow-lg transition flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i>
                        <span class="hidden sm:inline">Nuovo Cliente</span>
                    </button>

                    <button onclick="exportData()" title="Esporta Backup CSV" class="bg-white/10 hover:bg-white/20 text-white p-2 rounded-xl transition">
                        <i class="fa-solid fa-file-export"></i>
                    </button>

                    <button onclick="askResetConfirmation()" title="Ripristina Dati Aggiornati" class="bg-white/10 hover:bg-rose-500/80 text-white p-2 rounded-xl transition">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- WEEKLY PAYMENT REMINDER BOX -->
        <section class="bg-white rounded-2xl border-2 border-sky-200 shadow-sm overflow-hidden">
            <div class="bg-gradient-to-r from-sky-50 to-indigo-50 px-4 sm:px-6 py-4 border-b border-sky-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                    <div class="flex items-center gap-2">
                        <span class="w-8 h-8 rounded-lg bg-sky-600 text-white flex items-center justify-center text-sm shadow-sm">
                            <i class="fa-solid fa-calendar-check"></i>
                        </span>
                        <div>
                            <h2 id="weeklyReminderTitle" class="font-bold text-slate-900 text-base">Pagamenti Previsti Questa Settimana</h2>
                            <p id="weeklyReminderRange" class="text-xs text-slate-500 font-medium">Settimana corrente</p>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between sm:justify-end gap-2">
                    <div class="bg-white px-3 py-1.5 rounded-xl border border-sky-200 text-right mr-1">
                        <span class="block text-[10px] font-bold uppercase text-slate-400">Totale Settimana</span>
                        <span id="weeklyTotalAmount" class="text-sm font-extrabold text-sky-700">€ 0</span>
                    </div>

                    <div class="inline-flex rounded-xl bg-white border border-slate-200 p-1 shadow-xs">
                        <button onclick="changeReminderWeek(-1)" class="px-2.5 py-1 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg transition" title="Settimana Precedente">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <button onclick="resetReminderWeek()" class="px-2.5 py-1 text-xs font-bold text-sky-700 hover:bg-sky-50 rounded-lg transition">
                            Oggi
                        </button>
                        <button onclick="changeReminderWeek(1)" class="px-2.5 py-1 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg transition" title="Settimana Prossima">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div id="weeklyReminderList" class="p-4 sm:p-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                <!-- Populated dynamically -->
            </div>
        </section>

        <!-- KPI STATS SUMMARY DASHBOARD -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
            <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm flex flex-col justify-between">
                <div class="flex items-center justify-between text-slate-500 text-xs font-semibold uppercase">
                    <span>Valore Giro</span>
                    <i class="fa-solid fa-wallet text-sky-500 text-sm"></i>
                </div>
                <div class="mt-2">
                    <div id="kpi-total-price" class="text-xl sm:text-2xl font-extrabold text-slate-900">€ 0</div>
                    <div id="kpi-total-clients" class="text-xs text-slate-500 mt-0.5">0 clienti</div>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-4 border border-amber-200 bg-amber-50/30 shadow-sm flex flex-col justify-between">
                <div class="flex items-center justify-between text-amber-700 text-xs font-semibold uppercase">
                    <span>Da Incassare</span>
                    <i class="fa-solid fa-clock text-amber-500 text-sm"></i>
                </div>
                <div class="mt-2">
                    <div id="kpi-pending-amount" class="text-xl sm:text-2xl font-extrabold text-amber-800">€ 0</div>
                    <div id="kpi-pending-count" class="text-xs text-amber-600 font-medium mt-0.5">0 da incassare</div>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-4 border border-emerald-200 bg-emerald-50/30 shadow-sm flex flex-col justify-between">
                <div class="flex items-center justify-between text-emerald-700 text-xs font-semibold uppercase">
                    <span>In Regola</span>
                    <i class="fa-solid fa-circle-check text-emerald-500 text-sm"></i>
                </div>
                <div class="mt-2">
                    <div id="kpi-paid-amount" class="text-xl sm:text-2xl font-extrabold text-emerald-800">€ 0</div>
                    <div id="kpi-paid-count" class="text-xs text-emerald-600 font-medium mt-0.5">0 saldati</div>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-4 border border-indigo-200 bg-indigo-50/30 shadow-sm flex flex-col justify-between">
                <div class="flex items-center justify-between text-indigo-700 text-xs font-semibold uppercase">
                    <span>In Corso Ciclo</span>
                    <i class="fa-solid fa-hourglass-half text-indigo-500 text-sm"></i>
                </div>
                <div class="mt-2">
                    <div id="kpi-waiting-count" class="text-xl sm:text-2xl font-extrabold text-indigo-900">0</div>
                    <div class="text-xs text-indigo-600 font-medium mt-0.5">Prestazioni parziali</div>
                </div>
            </div>
        </div>

        <!-- SEARCH BAR & FILTER PILLS -->
        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm space-y-4">
            <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
                <!-- Search Input -->
                <div class="relative w-full sm:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Cerca negozio o note..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition">
                </div>

                <!-- Sort Dropdown -->
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <label for="sortBy" class="text-xs font-semibold text-slate-500 uppercase whitespace-nowrap">Ordina:</label>
                    <select id="sortBy" onchange="renderClients()" class="w-full sm:w-auto bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500">
                        <option value="name">Nome (A-Z)</option>
                        <option value="nextPay">Prossimo Pagamento</option>
                        <option value="status">Stato (Da pagare prima)</option>
                        <option value="priceDesc">Prezzo (Più alto)</option>
                        <option value="priceAsc">Prezzo (Più basso)</option>
                        <option value="dateDesc">Data Ultimo Servizio</option>
                    </select>
                </div>
            </div>

            <!-- Filter Pills -->
            <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs">
                <button id="filter-ALL" onclick="setFilter('ALL')" class="filter-btn active px-3.5 py-1.5 rounded-xl font-medium transition whitespace-nowrap bg-sky-600 text-white shadow-sm">
                    Tutti (<span id="cnt-ALL">0</span>)
                </button>
                <button id="filter-DA_PAGARE" onclick="setFilter('DA_PAGARE')" class="filter-btn px-3.5 py-1.5 rounded-xl font-medium transition whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200">
                    ⚠️ Da Incassare / Ritardo (<span id="cnt-DA_PAGARE">0</span>)
                </button>
                <button id="filter-ATTESA_2A" onclick="setFilter('ATTESA_2A')" class="filter-btn px-3.5 py-1.5 rounded-xl font-medium transition whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200">
                    ⏳ Ciclo in Corso (<span id="cnt-ATTESA_2A">0</span>)
                </button>
                <button id="filter-PAGATO" onclick="setFilter('PAGATO')" class="filter-btn px-3.5 py-1.5 rounded-xl font-medium transition whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200">
                    ✅ Saldati (<span id="cnt-PAGATO">0</span>)
                </button>
                <button id="filter-OGNI_2" onclick="setFilter('OGNI_2')" class="filter-btn px-3.5 py-1.5 rounded-xl font-medium transition whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200">
                    Ogni 2 Prestaz. (<span id="cnt-OGNI_2">0</span>)
                </button>
                <button id="filter-OGNI_4" onclick="setFilter('OGNI_4')" class="filter-btn px-3.5 py-1.5 rounded-xl font-medium transition whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200">
                    Settimanali / Mensili (<span id="cnt-OGNI_4">0</span>)
                </button>
            </div>
        </div>

        <!-- CLIENT CARDS GRID -->
        <div id="clientCardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
            <!-- Cards rendered dynamically -->
        </div>

        <!-- EMPTY STATE -->
        <div id="emptyState" class="hidden text-center
